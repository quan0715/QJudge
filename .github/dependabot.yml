version: 2

# Keep scheduled maintenance in one review and one CI run across the stack.
# GitHub still opens security updates independently of this weekly schedule.
multi-ecosystem-groups:
  maintenance:
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 1

updates:
  - package-ecosystem: pip
    directories:
      - /backend/requirements
      - /ai-service
      - /integrity-service
    patterns: ["*"]
    multi-ecosystem-group: maintenance

  - package-ecosystem: uv
    directory: /mcp-server
    patterns: ["*"]
    multi-ecosystem-group: maintenance

  - package-ecosystem: npm
    directory: /frontend
    patterns: ["*"]
    multi-ecosystem-group: maintenance

  - package-ecosystem: docker
    directories:
      - /backend
      - /backend/judge
      - /frontend
      - /ai-service
      - /mcp-server
      - /integrity-service
      - /deploy/agent
    patterns: ["*"]
    multi-ecosystem-group: maintenance
    ignore:
      # Python 3.x runtime upgrades are deliberate migrations, not routine bumps.
      - dependency-name: python
        update-types: [version-update:semver-minor]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/frontend-deps
      - /.github/actions/qjudge-stack
    patterns: ["*"]
    multi-ecosystem-group: maintenance
