# Playwright E2E：每個合併到 main 的 PR 都會執行（不設路徑過濾），也可手動觸發。
# auth、exam、contest、coding 四組平行執行，各自以 ci/e2e-stack.sh 全新安裝 stack（image 重用 GitHub Actions 的 layer cache），Playwright 在 runner 上執行。
name: E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      group:
        description: "Test group to run (all = every group in parallel)"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - auth
          - exam
          - contest
          - coding
      grep:
        description: "Optional grep pattern"
        required: false
        default: ""
        type: string

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-auth:
    name: "E2E: Auth & Pending Actions"
    if: github.event_name != 'workflow_dispatch' || inputs.group == 'all' || inputs.group == 'auth'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Install QJudge from scratch
        uses: ./.github/actions/qjudge-stack
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install frontend dependencies and Chromium
        uses: ./.github/actions/frontend-deps
        with:
          playwright: "true"
      - name: Run Auth E2E
        working-directory: frontend
        env:
          E2E_GREP: ${{ inputs.grep }}
        run: |
          set -euo pipefail
          cmd=(npm run test:e2e -- tests/e2e/auth.e2e.spec.ts tests/e2e/password-recovery.e2e.spec.ts tests/e2e/pending-actions-classroom-join.e2e.spec.ts tests/e2e/pending-actions-register-redirect.e2e.spec.ts)
          if [[ -n "$E2E_GREP" ]]; then cmd+=("--grep" "$E2E_GREP"); fi
          "${cmd[@]}"
      - name: Collect logs
        if: always() && env.QJ_DC != ''
        run: $QJ_DC logs --no-color > e2e-auth.log
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-auth-artifacts
          path: |
            frontend/playwright-report-e2e
            frontend/test-results
            e2e-auth.log
          retention-days: 14

  e2e-exam:
    name: "E2E: Exam"
    if: github.event_name != 'workflow_dispatch' || inputs.group == 'all' || inputs.group == 'exam'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Install QJudge from scratch
        uses: ./.github/actions/qjudge-stack
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install frontend dependencies and Chromium
        uses: ./.github/actions/frontend-deps
        with:
          playwright: "true"
      - name: Run Exam E2E
        working-directory: frontend
        env:
          E2E_GREP: ${{ inputs.grep }}
        run: |
          set -euo pipefail
          cmd=(npm run test:e2e -- tests/e2e/exam-full-lifecycle.e2e.spec.ts tests/e2e/exam-login-dual-device.e2e.spec.ts tests/e2e/resident-integrity.e2e.spec.ts)
          if [[ -n "$E2E_GREP" ]]; then cmd+=("--grep" "$E2E_GREP"); fi
          "${cmd[@]}"
      - name: Collect logs
        if: always() && env.QJ_DC != ''
        run: $QJ_DC logs --no-color > e2e-exam.log
      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-exam-artifacts
          path: |
            frontend/playwright-report-e2e
            frontend/test-results
            e2e-exam.log
          retention-days: 14

  e2e-contest:
    name: "E2E: Contest"
    if: github.event_name != 'workflow_dispatch' || inputs.group == 'all' || inputs.group == 'contest'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Install QJudge from scratch
        uses: ./.github/actions/qjudge-stack
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install frontend dependencies and Chromium
        uses: ./.github/actions/frontend-deps
        with:
          playwright: "true"
      - name: Run Contest E2E
        working-directory: frontend
        env:
          E2E_GREP: ${{ inputs.grep }}
        run: |
          set -euo pipefail
          cmd=(npm run test:e2e -- tests/e2e/contest-create.e2e.spec.ts tests/e2e/contest-problem-editor.e2e.spec.ts tests/e2e/classroom-settings.e2e.spec.ts)
          if [[ -n "$E2E_GREP" ]]; then cmd+=("--grep" "$E2E_GREP"); fi
          "${cmd[@]}"
      - name: Collect logs
        if: always() && env.QJ_DC != ''
        run: $QJ_DC logs --no-color > e2e-contest.log
      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-contest-artifacts
          path: |
            frontend/playwright-report-e2e
            frontend/test-results
            e2e-contest.log
          retention-days: 14

  e2e-coding:
    name: "E2E: Coding submissions"
    if: github.event_name != 'workflow_dispatch' || inputs.group == 'all' || inputs.group == 'coding'
    uses: ./.github/workflows/e2e-coding.yml
    with:
      grep: ${{ inputs.grep }}
