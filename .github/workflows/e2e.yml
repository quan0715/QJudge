# Playwright E2E：每個合併到 main 的 PR 都會執行 auth 與 coding（不設路徑過濾）；
# exam、contest、settings 的 spec 尚未跟上目前的 UI／API，暫時只能手動觸發。
# 每組各自以 ci/e2e-stack.sh 全新安裝 stack，Playwright 在 runner 上執行。
name: E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      group:
        description: "Test group to run (all = every group in parallel)"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - auth
          - exam
          - contest
          - coding
          - settings
      grep:
        description: "Optional grep pattern"
        required: false
        default: ""
        type: string

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-auth:
    name: "E2E: Auth & Pending Actions"
    if: github.event_name != 'workflow_dispatch' || inputs.group == 'all' || inputs.group == 'auth'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve bundled MinIO on the runner
        run: echo "127.0.0.1 minio" | sudo tee -a /etc/hosts
      - name: Install QJudge from scratch
        run: ci/e2e-stack.sh
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Auth E2E
        working-directory: frontend
        env:
          E2E_GREP: ${{ inputs.grep }}
        run: |
          set -euo pipefail
          cmd=(npm run test:e2e -- tests/e2e/auth.e2e.spec.ts tests/e2e/pending-actions-classroom-join.e2e.spec.ts tests/e2e/pending-actions-register-redirect.e2e.spec.ts)
          if [[ -n "$E2E_GREP" ]]; then cmd+=("--grep" "$E2E_GREP"); fi
          "${cmd[@]}"
      - name: Collect logs
        if: always() && env.QJ_DC != ''
        run: $QJ_DC logs --no-color > e2e-auth.log
      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-auth-artifacts
          path: |
            frontend/playwright-report-e2e
            frontend/test-results
            e2e-auth.log
          retention-days: 14

  e2e-exam:
    name: "E2E: Exam"
    if: github.event_name == 'workflow_dispatch' && (inputs.group == 'all' || inputs.group == 'exam')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve bundled MinIO on the runner
        run: echo "127.0.0.1 minio" | sudo tee -a /etc/hosts
      - name: Install QJudge from scratch
        run: ci/e2e-stack.sh
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Exam E2E
        working-directory: frontend
        env:
          E2E_GREP: ${{ inputs.grep }}
        run: |
          set -euo pipefail
          cmd=(npm run test:e2e -- tests/e2e/exam-full-lifecycle.e2e.spec.ts tests/e2e/exam-login-dual-device.e2e.spec.ts)
          if [[ -n "$E2E_GREP" ]]; then cmd+=("--grep" "$E2E_GREP"); fi
          "${cmd[@]}"
      - name: Collect logs
        if: always() && env.QJ_DC != ''
        run: $QJ_DC logs --no-color > e2e-exam.log
      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-exam-artifacts
          path: |
            frontend/playwright-report-e2e
            frontend/test-results
            e2e-exam.log
          retention-days: 14

  e2e-contest:
    name: "E2E: Contest"
    if: github.event_name == 'workflow_dispatch' && (inputs.group == 'all' || inputs.group == 'contest')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve bundled MinIO on the runner
        run: echo "127.0.0.1 minio" | sudo tee -a /etc/hosts
      - name: Install QJudge from scratch
        run: ci/e2e-stack.sh
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Contest E2E
        working-directory: frontend
        env:
          E2E_GREP: ${{ inputs.grep }}
        run: |
          set -euo pipefail
          cmd=(npm run test:e2e -- tests/e2e/contest-create.e2e.spec.ts tests/e2e/contest-problem-editor.e2e.spec.ts tests/e2e/classroom-settings.e2e.spec.ts)
          if [[ -n "$E2E_GREP" ]]; then cmd+=("--grep" "$E2E_GREP"); fi
          "${cmd[@]}"
      - name: Collect logs
        if: always() && env.QJ_DC != ''
        run: $QJ_DC logs --no-color > e2e-contest.log
      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-contest-artifacts
          path: |
            frontend/playwright-report-e2e
            frontend/test-results
            e2e-contest.log
          retention-days: 14

  e2e-coding:
    name: "E2E: Coding submissions"
    if: github.event_name != 'workflow_dispatch' || inputs.group == 'all' || inputs.group == 'coding'
    uses: ./.github/workflows/e2e-coding.yml
    with:
      grep: ${{ inputs.grep }}

  e2e-settings:
    name: "E2E: Settings & Preferences"
    if: github.event_name == 'workflow_dispatch' && (inputs.group == 'all' || inputs.group == 'settings')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve bundled MinIO on the runner
        run: echo "127.0.0.1 minio" | sudo tee -a /etc/hosts
      - name: Install QJudge from scratch
        run: ci/e2e-stack.sh
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Settings E2E
        working-directory: frontend
        env:
          E2E_GREP: ${{ inputs.grep }}
        run: |
          set -euo pipefail
          cmd=(npm run test:e2e -- tests/e2e/preferences-i18n-theme.e2e.spec.ts)
          if [[ -n "$E2E_GREP" ]]; then cmd+=("--grep" "$E2E_GREP"); fi
          "${cmd[@]}"
      - name: Collect logs
        if: always() && env.QJ_DC != ''
        run: $QJ_DC logs --no-color > e2e-settings.log
      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-settings-artifacts
          path: |
            frontend/playwright-report-e2e
            frontend/test-results
            e2e-settings.log
          retention-days: 14
