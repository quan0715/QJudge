name: Authentication and coding exam E2E

on:
  workflow_call:
    inputs:
      grep:
        type: string
        default: ""
  workflow_dispatch:

jobs:
  coding-submissions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve bundled MinIO on the runner
        run: echo "127.0.0.1 minio" | sudo tee -a /etc/hosts
      - name: Install QJudge with real API and judge workers
        run: ci/e2e-stack.sh
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify asynchronous judge dispatch is enabled
        run: |
          $QJ_DC exec -T backend \
            python manage.py shell -c 'from django.conf import settings; assert not settings.CELERY_TASK_ALWAYS_EAGER'
      - name: Verify login, registration and onboarding
        working-directory: frontend
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-auth
        run: npm run test:e2e -- tests/e2e/auth.e2e.spec.ts --no-deps --workers=1 --output=test-results-auth
      - name: Run coding submissions through the browser and judge
        working-directory: frontend
        env:
          E2E_GREP: ${{ inputs.grep }}
        run: |
          cmd=(npm run test:e2e -- tests/e2e/coding-submissions.e2e.spec.ts --no-deps)
          if [[ -n "$E2E_GREP" ]]; then cmd+=(--grep "$E2E_GREP"); fi
          "${cmd[@]}"
      - name: Collect service logs
        if: always() && env.QJ_DC != ''
        run: $QJ_DC logs --no-color > e2e-coding.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coding-submissions-e2e
          path: |
            frontend/playwright-report-auth
            frontend/test-results-auth
            frontend/playwright-report-e2e
            frontend/test-results
            e2e-coding.log
          retention-days: 14
