name: CI

# main only changes through release pull requests, whose required checks already
# ran this workflow, so pushes to main do not run it again.
on:
  push:
    branches: [dev]
    paths:
      - "frontend/**"
      - ".codex/skills/qjudge-*/**"
      - "backend/**"
      - "integrity-service/**"
      - "mcp-server/**"
      - "ai-service/**"
      - "deploy/**"
      - "compose.dev.yml"
      - "ci/**"
      - "loadtest/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/**"
  pull_request:
    branches: [main, dev]
    paths:
      - "frontend/**"
      - ".codex/skills/qjudge-*/**"
      - "backend/**"
      - "integrity-service/**"
      - "mcp-server/**"
      - "ai-service/**"
      - "deploy/**"
      - "compose.dev.yml"
      - "ci/**"
      - "loadtest/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Static Analysis (runs alongside the test jobs; the frontend production
  # build is covered by the frontend image built in Integration Tests)
  # ============================================
  static-checks:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/frontend-deps

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Deploy CLI Tests
        run: python3 -m unittest discover -s deploy/qjudge_cli/tests -t deploy

      - name: Deploy Compose Lint and Config
        run: |
          deploy/qjudge lint-compose deploy/compose.yml deploy/addons/storage/compose.yml deploy/addons/media/compose.yml
          QJUDGE_VERSION=ci docker compose --project-directory deploy --env-file deploy/.env.example \
            -f deploy/compose.yml -f deploy/compose.build.yml config --quiet
          docker compose --project-directory deploy --env-file deploy/.env.example \
            -f deploy/addons/storage/compose.yml config --quiet
          docker compose --project-directory deploy --env-file deploy/.env.example \
            -f deploy/addons/media/compose.yml config --quiet

      - name: Frontend Quality Gate Contract Tests
        run: node --test .codex/skills/qjudge-quality-gates-owner/scripts/*.test.js

      - name: Frontend Naming, Architecture, and Carbon Gates
        run: |
          node .codex/skills/qjudge-quality-gates-owner/scripts/lint-naming.js --root frontend/src
          node .codex/skills/qjudge-quality-gates-owner/scripts/lint-architecture.js --root frontend/src
          node .codex/skills/qjudge-quality-gates-owner/scripts/lint-repository-exports.js
          bash .codex/skills/qjudge-quality-gates-owner/scripts/check-carbon-style.sh --all

      - name: i18n Health Check (Reporting)
        run: python3 scripts/i18n/i18n_check.py

      - name: TypeScript Compile Check
        run: npm run typecheck
        working-directory: frontend

  # ============================================
  # Frontend Unit Tests
  # ============================================
  frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/frontend-deps

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Unit Tests with Coverage
        run: npm run test:coverage
        working-directory: frontend

      - name: Upload Coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 14

  # ============================================
  # Integration Tests (fresh `deploy/qjudge` install via ci/e2e-stack.sh)
  # Covers: Frontend API tests + MCP Server integration tests
  # Playwright E2E lives in e2e.yml (every pull request to main)
  # ============================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7

      - name: Install QJudge from scratch
        uses: ./.github/actions/qjudge-stack
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/frontend-deps

      - name: Frontend API Integration Tests
        run: npm run test:api
        working-directory: frontend

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install MCP Server dependencies
        run: pip install "mcp[cli]>=1.9.0,<2.0" "httpx>=0.27.0" "PyJWT[crypto]>=2.9,<3.0" pytest
        working-directory: mcp-server

      - name: MCP Server Integration Tests
        env:
          DJANGO_BASE_URL: http://localhost:8080
          DJANGO_FORWARDED_PROTO: http
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest tests/test_integration.py -v
        working-directory: mcp-server

      - name: Collect compose logs
        if: always() && env.QJ_DC != ''
        run: $QJ_DC logs --no-color > integration.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-artifacts
          path: integration.log
          retention-days: 14

  # ============================================
  # Backend Unit Tests (no Judge)
  # ============================================
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_oj
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_oj
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: test-secret-key-for-ci
      JUDGE_ENGINE_ENABLED: "false"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt
        working-directory: backend

      - name: Migrate
        run: python manage.py migrate --noinput
        working-directory: backend

      - name: Run Tests with Coverage
        run: |
          pytest \
            --ignore=apps/judge/ \
            --ignore=apps/submissions/tests/test_performance.py \
            --tb=short \
            --cov=apps \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            -q
        working-directory: backend

      - name: Upload Coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          retention-days: 14

  mcp-server-unit:
    name: MCP Server Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: mcp-server/pyproject.toml

      - name: Install MCP Server dependencies
        run: pip install "mcp[cli]>=1.9.0,<2.0" "httpx>=0.27.0" "PyJWT[crypto]>=2.9,<3.0" pytest
        working-directory: mcp-server

      - name: Run MCP Server Tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest tests -q
        working-directory: mcp-server

  ai-service-unit:
    name: AI Service Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: qjudge_ai_test
          POSTGRES_USER: ai_test
          POSTGRES_PASSWORD: ai_test_password
        options: >-
          --health-cmd "pg_isready -U ai_test -d qjudge_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      AI_TEST_REDIS_URL: redis://localhost:6379/0
      AI_TEST_DATABASE_URL: postgresql+psycopg://ai_test:ai_test_password@localhost:5432/qjudge_ai_test
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml
      - name: Install AI Service dependencies
        run: pip install ".[test]"
      - name: Run AI Service Tests
        run: python -m pytest tests -q

  integrity-service-unit:
    name: Integrity Service Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: integrity-service/pyproject.toml

      - name: Install Integrity Service dependencies
        run: pip install ".[worker,test]"
        working-directory: integrity-service

      # Secret bootstrap tests chown files and drop privileges, so they need root.
      - name: Run Integrity Service Tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: sudo --preserve-env=PYTHONDONTWRITEBYTECODE "$pythonLocation/bin/python" -m pytest -q -p no:cacheprovider
        working-directory: integrity-service

  # ============================================
  # Judge System Tests (needs Docker)
  # ============================================
  judge:
    name: Judge Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_oj
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_oj
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: test-secret-key-for-ci
      JUDGE_ENGINE_ENABLED: "true"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt
        working-directory: backend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve Judge Source
        id: judge-source
        run: |
          source=$(git rev-parse HEAD:backend/judge)
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "DOCKER_IMAGE_JUDGE=oj-judge:source-$source" >> "$GITHUB_ENV"

      - name: Build Judge Image
        uses: docker/build-push-action@v7
        with:
          context: backend/judge
          file: backend/judge/Dockerfile.judge
          tags: oj-judge:source-${{ steps.judge-source.outputs.source }}
          load: true
          cache-from: type=gha,scope=judge
          cache-to: type=gha,scope=judge,mode=max

      - name: Verify Judge Image
        run: |
          docker run --rm "$DOCKER_IMAGE_JUDGE" g++ --version

      - name: Migrate
        run: python manage.py migrate --noinput
        working-directory: backend

      - name: Judge Tests
        run: python manage.py test apps.judge --verbosity=2
        working-directory: backend

      - name: Submission Integration Tests
        env:
          PYTEST_ADDOPTS: --no-cov
        run: pytest apps/submissions/tests/test_performance.py -v --tb=short
        working-directory: backend

      - name: Cleanup
        if: always()
        run: docker rmi "$DOCKER_IMAGE_JUDGE" || true
