name: Deploy Documentation

# Deploy standalone documentation to Cloudflare Pages.
# Triggered when documentation-related files are updated on main branch

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "frontend/public/docs/**"
      - "frontend/public/brand/**"
      - "frontend/pages/docs-worker.js"
      - ".github/workflows/deploy-docs.yml"
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: "npm"
          cache-dependency-path: docs-site/package-lock.json

      - name: Validate required secrets
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing required secret: CLOUDFLARE_API_TOKEN" >&2
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing required secret: CLOUDFLARE_ACCOUNT_ID" >&2
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Install dependencies
        run: npm ci
        working-directory: docs-site

      - name: Build documentation
        run: npm run typecheck && npm run build && node scripts/check-output.mjs
        working-directory: docs-site

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy build/client --project-name=qjudge-docs --branch=main
        working-directory: docs-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
