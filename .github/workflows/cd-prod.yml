name: CD Prod

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm deployment of the selected main commit to production
        required: true
        type: boolean
        default: false

concurrency:
  group: cd-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    # main only accepts release pull requests that passed the required CI and E2E
    # checks, so the selected commit is deployed without re-running CI.
    permissions:
      contents: read

    steps:
      - name: Determine SHA
        id: sha
        run: |
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.sha.outputs.sha }}

      - name: Validate required secrets
        run: |
          set -euo pipefail
          required=(
            TS_OAUTH_CLIENT_ID
            TS_OAUTH_SECRET
            PROD_SSH_HOST
            PROD_SSH_USER
            PROD_DEPLOY_PATH
          )
          for key in "${required[@]}"; do
            value="${!key:-}"
            if [ -z "$value" ]; then
              echo "Missing required secret: $key" >&2
              exit 1
            fi
          done
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest
          ping: ${{ secrets.PROD_SSH_HOST }}

      - name: Deploy on server
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
          DEPLOY_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          # Check out first so the server runs this release's deploy CLI. Checkout and upgrade
          # both run inside the release lock; QJUDGE_RELEASE_LOCK_HELD tells the CLI not to take
          # it again. While an upgrade started from the web UI is running, flock gives up after
          # 5 seconds with exit 75 and the deploy fails; the wait only covers the instant the host
          # agent probes the lock. The server needs util-linux flock.
          status=0
          tailscale ssh "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "cd '$PROD_DEPLOY_PATH' && flock -E 75 -w 5 deploy/.release.lock env QJUDGE_RELEASE_LOCK_HELD=1 sh -c \"git fetch --tags --prune origin && git checkout --detach '$DEPLOY_SHA' && deploy/qjudge upgrade '$DEPLOY_SHA'\"" \
            || status=$?
          if [ "$status" -eq 75 ]; then
            echo "A web-triggered upgrade or rollback is running on the host; retry after it completes" >&2
          fi
          exit "$status"
