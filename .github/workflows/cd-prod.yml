name: CD Prod

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm deployment of the selected main commit to production
        required: true
        type: boolean
        default: false

concurrency:
  group: cd-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      checks: read
      actions: read

    steps:
      - name: Determine SHA
        id: sha
        run: |
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.sha.outputs.sha }}

      - name: Validate required secrets
        run: |
          set -euo pipefail
          required=(
            TS_OAUTH_CLIENT_ID
            TS_OAUTH_SECRET
            PROD_SSH_HOST
            PROD_SSH_USER
            PROD_DEPLOY_PATH
          )
          for key in "${required[@]}"; do
            value="${!key:-}"
            if [ -z "$value" ]; then
              echo "Missing required secret: $key" >&2
              exit 1
            fi
          done
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}

      - name: Verify release CI
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          ci_run_id=""

          while [[ -z "$ci_run_id" ]] && (( SECONDS < deadline )); do
            ci_run_id="$(gh run list \
              --workflow CI \
              --commit "$DEPLOY_SHA" \
              --event push \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // ""')"
            if [[ -z "$ci_run_id" ]]; then
              echo "Waiting for the CI run for $DEPLOY_SHA to appear..."
              sleep 15
            fi
          done

          if [[ -z "$ci_run_id" ]]; then
            echo "Timed out waiting for the CI run for $DEPLOY_SHA to appear" >&2
            exit 1
          fi

          echo "Waiting for CI run $ci_run_id on $DEPLOY_SHA to finish..."
          gh run watch "$ci_run_id" --exit-status --interval 15

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest
          ping: ${{ secrets.PROD_SSH_HOST }}

      - name: Deploy on server
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
          DEPLOY_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          # Check out first so the server runs this release's deploy CLI.
          tailscale ssh "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "cd '$PROD_DEPLOY_PATH' && git fetch --tags --prune origin && git checkout --detach '$DEPLOY_SHA' && deploy/qjudge upgrade '$DEPLOY_SHA'"
