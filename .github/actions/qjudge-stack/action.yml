name: Install QJudge
description: >-
  Install QJudge from scratch with ci/e2e-stack.sh. Images are first built from
  the GitHub Actions layer cache on the same buildx builder, so the build inside
  `deploy/qjudge upgrade` reuses those layers instead of starting cold.
inputs:
  github-token:
    description: Token used to pull the judge image from GHCR.
    required: true
runs:
  using: composite
  steps:
    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Resolve bundled MinIO on the runner
      shell: bash
      run: echo "127.0.0.1 minio" | sudo tee -a /etc/hosts

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4

    - name: Build images from the layer cache
      uses: docker/bake-action@v7
      env:
        QJUDGE_VERSION: ci
        # Skip the build record artifact and job summary; nobody reads them.
        DOCKER_BUILD_RECORD_UPLOAD: "false"
        DOCKER_BUILD_SUMMARY: "false"
      with:
        source: ./deploy
        files: compose.yml,compose.build.yml
        # One target per image; the other services share these builds.
        targets: backend,ai-service,integrity-resident,qjudge-mcp,frontend
        load: true
        # One cache scope per image: a cache export replaces its scope's index,
        # so images sharing a scope would overwrite each other's layers.
        set: |
          backend.cache-from=type=gha,scope=qjudge-backend
          backend.cache-to=type=gha,scope=qjudge-backend,mode=max,ignore-error=true
          ai-service.cache-from=type=gha,scope=qjudge-ai-service
          ai-service.cache-to=type=gha,scope=qjudge-ai-service,mode=max,ignore-error=true
          integrity-resident.cache-from=type=gha,scope=qjudge-integrity-resident
          integrity-resident.cache-to=type=gha,scope=qjudge-integrity-resident,mode=max,ignore-error=true
          qjudge-mcp.cache-from=type=gha,scope=qjudge-qjudge-mcp
          qjudge-mcp.cache-to=type=gha,scope=qjudge-qjudge-mcp,mode=max,ignore-error=true
          frontend.cache-from=type=gha,scope=qjudge-frontend
          frontend.cache-to=type=gha,scope=qjudge-frontend,mode=max,ignore-error=true

    - name: Install QJudge from scratch
      shell: bash
      env:
        BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
      run: ci/e2e-stack.sh
