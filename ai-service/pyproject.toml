[project]
name = "ai-service"
version = "2.0.0"
description = "AI Service for QJudge - DeepAgent powered problem generation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
    # Keep this stack pinned. 0.5.2 is the first DeepAgents release with
    # filesystem permissions, used to protect the mounted skills/memory tree.
    "deepagents==0.5.2",
    "langchain==1.3.14",
    "langchain-core==1.5.3",
    "langgraph==1.2.10",
    "langgraph-prebuilt==1.1.0",
    "langgraph-checkpoint-postgres==3.0.4",
    "langchain-deepseek==1.0.1",
    "langchain-openai==1.1.5",
    "mcp>=1.9.0,<2.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary,pool]>=3.1,<4.0",
    "pypdf>=5.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sse-starlette>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "PyJWT[crypto]>=2.9,<3.0",
    "redis[hiredis]>=5.0,<6.0",
    "celery[redis]>=5.4,<6.0",
    "cryptography>=43,<46",
    "boto3>=1.34,<2.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
