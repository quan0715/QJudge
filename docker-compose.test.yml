services:
  judge-image-test:
    image: ${DOCKER_IMAGE_JUDGE:-ghcr.io/quan0715/qjudge/judge:latest}
    platform: ${DOCKER_JUDGE_PLATFORM:-linux/amd64}
    container_name: oj_judge_image_test
    command: ["true"]
    restart: "no"
    networks:
      - test-network

  postgres-test:
    image: postgres:15-alpine
    container_name: oj_postgres_test
    command: postgres -c max_connections=200 -c shared_buffers=256MB -c work_mem=4MB
    environment:
      POSTGRES_DB: test_oj_e2e
      POSTGRES_USER: oj_user
      POSTGRES_PASSWORD: oj_password
    ports:
      - "5433:5432"
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oj_user -d test_oj_e2e"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer-test:
    image: edoburu/pgbouncer:v1.24.1-p1
    container_name: oj_pgbouncer_test
    environment:
      DB_HOST: postgres-test
      DB_PORT: "5432"
      DB_NAME: "*"
      DB_USER: oj_user
      DB_PASSWORD: oj_password
      AUTH_TYPE: plain
      POOL_MODE: session
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "30"
      RESERVE_POOL_SIZE: "15"
      RESERVE_POOL_TIMEOUT: "2"
      MAX_DB_CONNECTIONS: "100"
      QUERY_WAIT_TIMEOUT: "120"
      SERVER_IDLE_TIMEOUT: "600"
      CLIENT_IDLE_TIMEOUT: "0"
      SERVER_RESET_QUERY: "DISCARD ALL"
      IGNORE_STARTUP_PARAMETERS: "extra_float_digits,options"
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
      LOG_STATS: "0"
    ports:
      - "6433:5432"
    networks:
      - test-network
    depends_on:
      postgres-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U oj_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: oj_redis_test
    ports:
      - "6380:6379"
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend-test:
    build: &backend_test_build
      context: ./backend
      dockerfile: Dockerfile
      args:
        DJANGO_ENV: development
    image: oj_backend_test_img
    container_name: oj_backend_test
    command: >
      sh -c "
        python manage.py migrate &&
        bash /app/scripts/setup_e2e_env.sh &&
        python manage.py runserver 0.0.0.0:8000
      "
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.test
      - POSTGRES_DB=test_oj_e2e
      - POSTGRES_USER=oj_user
      - POSTGRES_PASSWORD=oj_password
      - POSTGRES_HOST=postgres-test
      - POSTGRES_PORT=5432
      - DB_CONN_MAX_AGE=0
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis-test:6379/0
      - SECRET_KEY=test-secret-key-for-ci-only
      - DEBUG=True
      - ALLOWED_HOSTS=*
      - DOCKER_IMAGE_JUDGE=${DOCKER_IMAGE_JUDGE:-ghcr.io/quan0715/qjudge/judge:latest}
      - DOCKER_JUDGE_PLATFORM=${DOCKER_JUDGE_PLATFORM:-linux/amd64}
      - INTEGRITY_CONTROLLER_URL=http://integrity-controller:8010
      - INTEGRITY_CONTROLLER_TOKEN_FILE=/run-secrets/controller-token
      - INTEGRITY_WORKER_IMAGE=${INTEGRITY_WORKER_IMAGE:-oj-integrity-worker:local}
      - INTEGRITY_WORKER_SIGNING_PRIVATE_KEY_FILE=/run-secrets/integrity-worker-signing-key
    ports:
      - "8002:8000"
    depends_on:
      postgres-test:
        condition: service_healthy
      pgbouncer-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ${INTEGRITY_TEST_SECRETS_DIR:-./.tmp/integrity-test-secrets}/controller-token:/run-secrets/controller-token:ro
      - ${INTEGRITY_TEST_SECRETS_DIR:-./.tmp/integrity-test-secrets}/integrity-worker-signing-key:/run-secrets/integrity-worker-signing-key:ro
    networks:
      - test-network

  # Tests provide only temporary key files through INTEGRITY_TEST_SECRETS_DIR;
  # raw Controller tokens and signing keys are never Compose environment values.
  integrity-controller:
    build:
      context: ./integrity-service
      dockerfile: Dockerfile.controller
    image: oj-integrity-controller:test
    container_name: oj_integrity_controller_test
    restart: unless-stopped
    environment:
      - INTEGRITY_CONTROLLER_INTERNAL_TOKEN_FILE=/run-secrets/controller-token
      - INTEGRITY_WORKER_IMAGE_ALLOWLIST=${INTEGRITY_WORKER_IMAGE:-oj-integrity-worker:local}
      - INTEGRITY_WORKER_NETWORK=${INTEGRITY_WORKER_NETWORK_TEST:-online_judge_test-network}
      - BACKEND_INTERNAL_URL=http://backend-test:8000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${INTEGRITY_TEST_SECRETS_DIR:-./.tmp/integrity-test-secrets}/controller-token:/run-secrets/controller-token:ro
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID to the host Docker socket group}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    privileged: false
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://localhost:8010/health').status == 200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  integrity-worker-image:
    image: ${INTEGRITY_WORKER_IMAGE:-oj-integrity-worker:local}
    build:
      context: ./integrity-service
      dockerfile: Dockerfile.worker
    command: ["python", "-c", "print('integrity worker image ready')"]
    restart: "no"
    profiles: ["build"]
    networks:
      - test-network

  celery-test:
    build: *backend_test_build
    image: oj_backend_test_img
    container_name: oj_celery_test
    command: celery -A config worker -l info -Q default
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.test
      - POSTGRES_DB=test_oj_e2e
      - POSTGRES_USER=oj_user
      - POSTGRES_PASSWORD=oj_password
      - POSTGRES_HOST=postgres-test
      - POSTGRES_PORT=5432
      - DB_CONN_MAX_AGE=0
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis-test:6379/0
      - SECRET_KEY=test-secret-key-for-ci-only
      - DEBUG=True
      - JUDGE_TMP_DIR=/judge_tmp
      - DOCKER_IMAGE_JUDGE=${DOCKER_IMAGE_JUDGE:-ghcr.io/quan0715/qjudge/judge:latest}
      - DOCKER_JUDGE_PLATFORM=${DOCKER_JUDGE_PLATFORM:-linux/amd64}
    depends_on:
      postgres-test:
        condition: service_healthy
      pgbouncer-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      backend-test:
        condition: service_started
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - judge-tmp-test:/judge_tmp
    networks:
      - test-network

  celery-high-test:
    extends:
      service: celery-test
    container_name: oj_celery_high_test
    command: celery -A config worker -l info -Q high_priority --concurrency=2

  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    container_name: oj_frontend_test
    command: npm run dev -- --host 0.0.0.0 --port 5174
    environment:
      - VITE_API_TARGET=http://backend-test:8000
    ports:
      - "5174:5174"
    depends_on:
      - backend-test
    volumes:
      - ./frontend:/app
      - ./backend:/backend:ro
      - /app/node_modules
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
    name: ${INTEGRITY_WORKER_NETWORK_TEST:-online_judge_test-network}

volumes:
  judge-tmp-test:
