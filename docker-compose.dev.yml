x-django-environment: &django_dev_environment
  DJANGO_ENV: development
  DEBUG: "True"
  DJANGO_SETTINGS_MODULE: config.settings.dev
  SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
  DB_NAME: online_judge
  DB_USER: qjudge_web
  DB_PASSWORD: ${DB_PASSWORD:-qjudge_web_dev}
  DB_HOST: pgbouncer
  DB_PORT: "5432"
  DB_SSLMODE: disable
  DB_CONN_MAX_AGE: "0"
  REDIS_URL: redis://redis:6379/0
  OAUTH_ISSUER_URL: ${OAUTH_ISSUER_URL:-http://localhost:8000}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
  MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:9002}
  AUTH_EMAIL_PASSWORD_ENABLED: ${AUTH_EMAIL_PASSWORD_ENABLED:-True}
  QAUTH_PROVIDER_CONNECTIONS_JSON: ${QAUTH_PROVIDER_CONNECTIONS_JSON:-[]}
  NYCU_OAUTH_CLIENT_ID: ${NYCU_OAUTH_CLIENT_ID:-}
  NYCU_OAUTH_CLIENT_SECRET: ${NYCU_OAUTH_CLIENT_SECRET:-}
  GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
  GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
  JUDGE_ENGINE_ENABLED: "True"
  JUDGE_MAX_CPU_TIME: "10"
  JUDGE_MAX_MEMORY: "256"
  DOCKER_IMAGE_JUDGE: ${DOCKER_IMAGE_JUDGE:-ghcr.io/quan0715/qjudge/judge:latest}
  DOCKER_JUDGE_PIDS_LIMIT: "64"
  DOCKER_JUDGE_TMPFS_SIZE: 100M
  DOCKER_JUDGE_TIMEOUT: "60"
  HOST_PROJECT_ROOT: ${HOST_PROJECT_ROOT:-}
  OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:?OBJECT_STORAGE_ENDPOINT_URL is required}
  OBJECT_STORAGE_PUBLIC_ENDPOINT_URL: ${OBJECT_STORAGE_PUBLIC_ENDPOINT_URL:?OBJECT_STORAGE_PUBLIC_ENDPOINT_URL is required}
  OBJECT_STORAGE_REGION: auto
  OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
  OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
  OBJECT_STORAGE_PRESIGNED_URL_TTL_SECONDS: "300"
  OBJECT_STORAGE_OBJECT_TAGGING_ENABLED: "false"
  OBJECT_STORAGE_AUTO_CREATE_BUCKETS: "false"
  ANTICHEAT_RAW_BUCKET: anticheat-raw
  ANTICHEAT_CAPTURE_INTERVAL_SECONDS: "3"
  MARKDOWN_IMAGE_S3_BUCKET: markdown-images
  MARKDOWN_IMAGE_MAX_BYTES: "5242880"
  MARKDOWN_IMAGE_PUBLIC_BASE_URL: http://localhost:5173
  INTEGRITY_ARCHIVE_MAX_BYTES: "52428800"
  LIVE_MONITORING_ENABLED: ${LIVE_MONITORING_ENABLED:-false}
  LIVE_MONITORING_ROOM_PREFIX: ${LIVE_MONITORING_ROOM_PREFIX:-qjudge-dev-exam}
  CLOUDFLARE_REALTIME_API_BASE_URL: ${CLOUDFLARE_REALTIME_API_BASE_URL:-https://rtc.live.cloudflare.com/v1}
  CLOUDFLARE_REALTIME_APP_ID: ${CLOUDFLARE_REALTIME_APP_ID:-}
  CLOUDFLARE_REALTIME_APP_SECRET: ${CLOUDFLARE_REALTIME_APP_SECRET:-}
  LIVE_MONITORING_PUBLISHER_TTL_SECONDS: ${LIVE_MONITORING_PUBLISHER_TTL_SECONDS:-60}

x-integrity-environment: &integrity_dev_environment
  INTEGRITY_RESIDENT_URL: http://integrity-resident:8011
  INTEGRITY_RESIDENT_SERVICE_TOKEN_FILE: /run-secrets/integrity/resident-service-token
  INTEGRITY_WORKER_SIGNING_PRIVATE_KEY_FILE: /run-secrets/integrity/integrity-worker-signing-key

x-ai-database-environment: &ai_dev_database_environment
  AI_DATABASE_URL: postgresql+psycopg://qjudge_ai:${AI_DB_PASSWORD:-qjudge_ai_dev}@postgres:5432/qjudge_ai
  AI_DB_USER: qjudge_ai
  AI_DB_NAME: qjudge_ai
x-ai-queue-environment: &ai_dev_queue_environment
  AI_REDIS_URL: redis://redis:6379/2
  AI_QUEUE_NAME: qjudge-ai
  AI_QUEUE_KEY_PREFIX: "qjudge-ai:"
x-ai-api-environment: &ai_dev_api_environment
  <<: [*ai_dev_database_environment, *ai_dev_queue_environment]
  CREDENTIAL_LEASE_SECRET: ${CREDENTIAL_LEASE_SECRET:-dev-credential-lease-secret-change-me}
  MCP_SERVER_ID: qjudge
  MCP_TOKEN_EXCHANGE_URL: http://backend:8000/api/oauth/token-exchange/
  QJUDGE_MCP_URL: http://qjudge-mcp:9000/mcp
  AI_OAUTH_ISSUER: ${OAUTH_ISSUER_URL:-http://localhost:8000}
  AI_OAUTH_JWKS_URL: http://backend:8000/.well-known/jwks.json
  AI_ARTIFACT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:?OBJECT_STORAGE_ENDPOINT_URL is required}
  AI_ARTIFACT_STORAGE_PUBLIC_ENDPOINT_URL: ${OBJECT_STORAGE_PUBLIC_ENDPOINT_URL:?OBJECT_STORAGE_PUBLIC_ENDPOINT_URL is required}
  AI_ARTIFACT_STORAGE_REGION: auto
  AI_ARTIFACT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
  AI_ARTIFACT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
  AI_ARTIFACT_STORAGE_AUTO_CREATE_BUCKET: ${OBJECT_STORAGE_AUTO_CREATE_BUCKETS:-false}
  AI_ARTIFACT_S3_BUCKET: ${AI_ARTIFACT_S3_BUCKET:-ai-artifacts}
  AI_ARTIFACT_MAX_BYTES: ${AI_ARTIFACT_MAX_BYTES:-10485760}
x-ai-worker-environment: &ai_dev_worker_environment
  <<: [*ai_dev_database_environment, *ai_dev_queue_environment]
  CREDENTIAL_LEASE_SECRET: ${CREDENTIAL_LEASE_SECRET:-dev-credential-lease-secret-change-me}
  MCP_SERVER_ID: qjudge
  MCP_TOKEN_EXCHANGE_URL: http://backend:8000/api/oauth/token-exchange/
  QJUDGE_MCP_URL: http://qjudge-mcp:9000/mcp
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  AI_ARTIFACT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:?OBJECT_STORAGE_ENDPOINT_URL is required}
  AI_ARTIFACT_STORAGE_PUBLIC_ENDPOINT_URL: ${OBJECT_STORAGE_PUBLIC_ENDPOINT_URL:?OBJECT_STORAGE_PUBLIC_ENDPOINT_URL is required}
  AI_ARTIFACT_STORAGE_REGION: auto
  AI_ARTIFACT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
  AI_ARTIFACT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
  AI_ARTIFACT_STORAGE_AUTO_CREATE_BUCKET: ${OBJECT_STORAGE_AUTO_CREATE_BUCKETS:-false}
  AI_ARTIFACT_S3_BUCKET: ${AI_ARTIFACT_S3_BUCKET:-ai-artifacts}
  AI_ARTIFACT_MAX_BYTES: ${AI_ARTIFACT_MAX_BYTES:-10485760}

services:
  # Judge Environment Image (pulled from registry; override DOCKER_IMAGE_JUDGE for local runtime debugging)
  judge-image:
    image: ${DOCKER_IMAGE_JUDGE:-ghcr.io/quan0715/qjudge/judge:latest}
    platform: ${DOCKER_JUDGE_PLATFORM:-linux/amd64}
    container_name: oj_judge_image_dev
    command: ["true"]
    restart: "no"
    networks:
      - oj_network_dev

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: oj_postgres_dev
    command: postgres -c max_connections=200 -c shared_buffers=256MB -c work_mem=4MB
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: qjudge_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-qjudge_admin_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - oj_network_dev
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U qjudge_admin -d postgres",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-db-bootstrap:
    image: postgres:15-alpine
    restart: "no"
    command: ["/bin/sh", "/bootstrap/bootstrap-ai-database.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_ADMIN_USER: qjudge_admin
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-qjudge_admin_dev}
      DB_NAME: online_judge
      DB_USER: qjudge_web
      DB_PASSWORD: ${DB_PASSWORD:-qjudge_web_dev}
      AI_DB_NAME: qjudge_ai
      AI_DB_USER: qjudge_ai
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-qjudge_ai_dev}
    volumes:
      - ./scripts/db/bootstrap-ai-database.sh:/bootstrap/bootstrap-ai-database.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oj_network_dev

  # PgBouncer – connection pooler (session mode, compatible with SELECT FOR UPDATE)
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    container_name: oj_pgbouncer_dev
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: online_judge
      DB_USER: qjudge_web
      DB_PASSWORD: ${DB_PASSWORD:-qjudge_web_dev}
      AUTH_TYPE: plain
      POOL_MODE: session
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "30"
      RESERVE_POOL_SIZE: "10"
      RESERVE_POOL_TIMEOUT: "3"
      MAX_DB_CONNECTIONS: "80"
      QUERY_WAIT_TIMEOUT: "120"
      SERVER_IDLE_TIMEOUT: "600"
      CLIENT_IDLE_TIMEOUT: "0"
      SERVER_RESET_QUERY: "DISCARD ALL"
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
      LOG_STATS: "0"
    ports:
      - "6432:5432"
    depends_on:
      ai-db-bootstrap:
        condition: service_completed_successfully
    networks:
      - oj_network_dev
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -p 5432 -U qjudge_web",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: oj_redis_dev
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    networks:
      - oj_network_dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-migrate:
    build: &ai_dev_build
      context: ./ai-service
      dockerfile: Dockerfile
    image: oj_ai_service_dev_img
    restart: "no"
    healthcheck:
      disable: true
    command: ["sh", "-c", "python -m alembic upgrade head && python -m infrastructure.checkpoints.langgraph_store setup"]
    environment:
      <<: *ai_dev_database_environment
    volumes:
      - ./ai-service:/app
    depends_on:
      ai-db-bootstrap:
        condition: service_completed_successfully
    networks:
      - oj_network_dev

  # AI Service (LangChain DeepAgent) - Dev Mode
  ai-service:
    build: *ai_dev_build
    image: oj_ai_service_dev_img
    container_name: oj_ai_service_dev
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    environment: *ai_dev_api_environment
    volumes:
      - ./ai-service:/app
    networks:
      - oj_network_dev
    depends_on:
      ai-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  ai-worker:
    build: *ai_dev_build
    image: oj_ai_service_dev_img
    healthcheck:
      disable: true
    command: ["celery", "-A", "worker.celery_app:celery_app", "worker", "--queues=qjudge-ai", "--loglevel=INFO"]
    environment: *ai_dev_worker_environment
    volumes:
      - ./ai-service:/app
    depends_on:
      ai-migrate:
        condition: service_completed_successfully
    networks:
      - oj_network_dev

  ai-scheduler:
    build: *ai_dev_build
    image: oj_ai_service_dev_img
    healthcheck:
      disable: true
    command: ["celery", "-A", "worker.celery_app:celery_app", "beat", "--loglevel=INFO"]
    environment: *ai_dev_queue_environment
    volumes:
      - ./ai-service:/app
    depends_on:
      ai-migrate:
        condition: service_completed_successfully
    networks:
      - oj_network_dev

  # Django Backend (Dev Mode; shared image with Celery — single build)
  backend:
    build: &backend_dev_build
      context: ./backend
      dockerfile: Dockerfile
      args:
        DJANGO_ENV: development
    image: oj_backend_dev_img
    container_name: oj_backend_dev
    command: python -m uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload --reload-dir /app
    volumes:
      - ./backend:/app
      - ./secrets:/run-secrets:ro
    ports:
      - "8000:8000"
    environment:
      <<: [*django_dev_environment, *integrity_dev_environment]
      HOST_PROJECT_ROOT: ${HOST_PROJECT_ROOT:-}
      AI_SERVICE_URL: http://ai-service:8001
      AI_OAUTH_SIGNING_PRIVATE_KEY_FILE: /run-secrets/ai-oauth-ed25519-private.pem
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:?OBJECT_STORAGE_ENDPOINT_URL is required}
      OBJECT_STORAGE_PUBLIC_ENDPOINT_URL: ${OBJECT_STORAGE_PUBLIC_ENDPOINT_URL:?OBJECT_STORAGE_PUBLIC_ENDPOINT_URL is required}
      OBJECT_STORAGE_REGION: auto
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
      OBJECT_STORAGE_PRESIGNED_URL_TTL_SECONDS: ${OBJECT_STORAGE_PRESIGNED_URL_TTL_SECONDS:-300}
      ANTICHEAT_RAW_BUCKET: ${ANTICHEAT_RAW_BUCKET:-anticheat-raw}
      DOCKER_IMAGE_JUDGE: ${DOCKER_IMAGE_JUDGE:-ghcr.io/quan0715/qjudge/judge:latest}
      DOCKER_JUDGE_PLATFORM: ${DOCKER_JUDGE_PLATFORM:-linux/amd64}
    depends_on:
      judge-image:
        condition: service_started
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      ai-oauth-bootstrap:
        condition: service_completed_successfully
      integrity-bootstrap:
        condition: service_completed_successfully
    networks:
      - oj_network_dev

  ai-oauth-bootstrap:
    build: *backend_dev_build
    image: oj_backend_dev_img
    restart: "no"
    command:
      - python
      - /bootstrap/bootstrap_ai_oauth_keys.py
      - --private-key
      - /oauth-secrets/ai-oauth-ed25519-private.pem
      - --public-key
      - /oauth-secrets/ai-oauth-ed25519-public.pem
    volumes:
      - ./scripts/bootstrap_ai_oauth_keys.py:/bootstrap/bootstrap_ai_oauth_keys.py:ro
      - ./secrets:/oauth-secrets
    networks:
      - oj_network_dev

  integrity-bootstrap:
    build: *backend_dev_build
    image: oj_backend_dev_img
    user: "0:0"
    restart: "no"
    command: ["python", "/bootstrap/bootstrap_integrity_secrets.py", "--secrets-dir", "/bootstrap-secrets", "--resident-gid", "10001"]
    volumes:
      - ./scripts/bootstrap_integrity_secrets.py:/bootstrap/bootstrap_integrity_secrets.py:ro
      - ./secrets/integrity:/bootstrap-secrets
    network_mode: none

  integrity-resident-data-init:
    image: ${INTEGRITY_RESIDENT_IMAGE:-oj-integrity-resident:dev}
    build: &integrity_resident_build
      context: ./integrity-service
      dockerfile: Dockerfile.resident
    user: "0:0"
    restart: "no"
    read_only: true
    command: ["sh", "-c", "chown 10001:10001 /run-data && chmod 0700 /run-data"]
    volumes:
      - integrity_resident_data:/run-data
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: ["no-new-privileges:true"]

  integrity-resident:
    image: ${INTEGRITY_RESIDENT_IMAGE:-oj-integrity-resident:dev}
    build: *integrity_resident_build
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    command: ["uvicorn", "integrity_service.resident.app:app", "--host", "0.0.0.0", "--port", "8011", "--workers", "1"]
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      INTEGRITY_RESIDENT_DATA_ROOT: /run-data
      INTEGRITY_RESIDENT_PUBLIC_KEY_FILE: /run-secrets/backend-public-key
      INTEGRITY_RESIDENT_SERVICE_TOKEN_FILE: /run-secrets/resident-service-token
    volumes:
      - integrity_resident_data:/run-data
      - type: bind
        source: ./secrets/integrity/backend-public-key
        target: /run-secrets/backend-public-key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/integrity/resident-service-token
        target: /run-secrets/resident-service-token
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      integrity-bootstrap:
        condition: service_completed_successfully
      integrity-resident-data-init:
        condition: service_completed_successfully
      backend:
        condition: service_started
    networks:
      - oj_network_dev
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://localhost:8011/ready').status == 200"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  integrity-reconciler:
    build: *backend_dev_build
    image: oj_backend_dev_img
    restart: unless-stopped
    command: ["python", "manage.py", "reconcile_integrity"]
    volumes:
      - ./backend:/app
      - ./secrets:/run-secrets:ro
    environment:
      <<: [*django_dev_environment, *integrity_dev_environment]
      DB_HOST: postgres
      ANTICHEAT_RAW_BUCKET: ${ANTICHEAT_RAW_BUCKET:-anticheat-raw}
      OBJECT_STORAGE_PRESIGNED_URL_TTL_SECONDS: ${OBJECT_STORAGE_PRESIGNED_URL_TTL_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
      integrity-bootstrap:
        condition: service_completed_successfully
      integrity-resident:
        condition: service_healthy
    networks:
      - oj_network_dev
  # Celery Worker (Dev Mode)
  celery:
    build: *backend_dev_build
    image: oj_backend_dev_img
    container_name: oj_celery_dev
    command: celery -A config.celery worker --loglevel=info -Q celery,default
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - judge_tmp:/judge_tmp
    environment:
      <<: *django_dev_environment
      JUDGE_TMP_DIR: /judge_tmp
      HOST_PROJECT_ROOT: ${HOST_PROJECT_ROOT:-}
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:?OBJECT_STORAGE_ENDPOINT_URL is required}
      OBJECT_STORAGE_REGION: auto
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
      ANTICHEAT_RAW_BUCKET: ${ANTICHEAT_RAW_BUCKET:-anticheat-raw}
      DOCKER_IMAGE_JUDGE: ${DOCKER_IMAGE_JUDGE:-ghcr.io/quan0715/qjudge/judge:latest}
      DOCKER_JUDGE_PLATFORM: ${DOCKER_JUDGE_PLATFORM:-linux/amd64}
    depends_on:
      judge-image:
        condition: service_started
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - oj_network_dev

  celery-high:
    extends:
      service: celery
    container_name: oj_celery_high_dev
    command: celery -A config.celery worker --loglevel=info -Q high_priority --concurrency=2

  # Celery Beat (Dev Mode - Scheduler for non-exam periodic tasks)
  celery-beat:
    build: *backend_dev_build
    image: oj_backend_dev_img
    container_name: oj_celery_beat_dev
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    environment:
      <<: *django_dev_environment
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - oj_network_dev

  # Frontend (Dev Mode with Hot Reload)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: oj_frontend_dev
    volumes:
      - ./frontend:/app
      - ./backend:/backend:ro
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://backend:8000
      - VITE_STORYBOOK_TARGET=http://storybook:6006
      - VITE_MCP_PUBLIC_URL=${VITE_MCP_PUBLIC_URL:-http://localhost:9002/mcp}
      - VITE_DOCS_PUBLIC_URL=${VITE_DOCS_PUBLIC_URL:-}
      - VITE_LANDING_PUBLIC_URL=${VITE_LANDING_PUBLIC_URL:-}
      - VITE_MAIN_APP_URL=${VITE_MAIN_APP_URL:-}
    depends_on:
      - backend
      - storybook
    networks:
      - oj_network_dev

  storybook:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: oj_storybook_dev
    command: npm run storybook -- --host 0.0.0.0 --ci
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "6006:6006"
    environment:
      - VITE_API_TARGET=http://backend:8000
    depends_on:
      - backend
    networks:
      - oj_network_dev
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: oj_cloudflared
    profiles: ["tunnel"]
    restart: always
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    networks:
      - oj_network_dev

  qjudge-mcp:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    container_name: oj_mcp_dev
    ports:
      - "9002:9000"
    environment:
      - DJANGO_BASE_URL=http://backend:8000
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL:-http://localhost:9002}
