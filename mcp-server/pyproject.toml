[project]
name = "qjudge-mcp-server"
version = "0.1.0"
description = "QJudge MCP Server for exam question management"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.3.0,<3.0",
    "httpx>=0.27.0",
    "PyJWT[crypto]>=2.15.1,<3.0",
    "starlette>=1.3.1,<2.0",
]

[tool.uv]
package = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
