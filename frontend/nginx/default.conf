server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Upstreams live in variables so nginx resolves them per request through
    # Docker's embedded DNS; a static name is resolved once at start and goes
    # stale when backend or qjudge-mcp is recreated without the frontend.
    # proxy_pass with a variable and no URI still forwards the original
    # request URI and query string.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $qjudge_backend http://backend:8000;
    set $qjudge_mcp http://qjudge-mcp:9000;

    # Bundled storage and LiveKit routes generated at container start.
    include /etc/nginx/qjudge-addons.conf;

    # Shared headers for every request proxied to backend services.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # $remote_addr is the client resolved by the realip module (see
    # 20-qjudge-real-ip.sh); never forward the request's own X-Forwarded-For,
    # or clients could spoof the IP backend code trusts.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $qjudge_forwarded_proto;

    # Reset secrets are carried in this API path. Application audit logs retain
    # redacted failures; avoid recording the raw URI in nginx access/error logs.
    location ^~ /api/v1/auth/password/resets/ {
        access_log off;
        error_log /dev/null crit;
        client_max_body_size 16k;
        proxy_pass $qjudge_backend;
    }

    location /api/ {
        client_max_body_size 12m;
        proxy_pass $qjudge_backend;
        # A location that sets any proxy_set_header no longer inherits the
        # server-level ones, so repeat them before the SSE-specific header.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $qjudge_forwarded_proto;
        # Server-sent events
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
    }

    # MCP endpoint and its OAuth protected-resource metadata (RFC 9728).
    # Regex locations win over the /.well-known/ and / prefixes; anchored so
    # paths like /mcp-foo still reach the SPA.
    location ~ ^/\.well-known/oauth-protected-resource(/|$) {
        proxy_pass $qjudge_mcp;
    }

    location ~ ^/mcp(/|$) {
        proxy_pass $qjudge_mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $qjudge_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Public ownership proof for the q-judge.com OpenAI plugin listing.
    location = /.well-known/openai-apps-challenge {
        default_type text/plain;
        try_files $uri =404;
    }

    location /.well-known/ {
        proxy_pass $qjudge_backend;
    }

    location /o/ {
        proxy_pass $qjudge_backend;
    }

    location /django-admin/ {
        proxy_pass $qjudge_backend;
    }

    location /admin/ {
        proxy_pass $qjudge_backend;
    }

    location /static/ {
        proxy_pass $qjudge_backend;
    }

    location /media/ {
        proxy_pass $qjudge_backend;
    }

    # SPA routes; keep last.
    location / {
        # Link headers for agent discovery (RFC 8288)
        add_header Link '</api/schema/>; rel="service-desc"' always;
        add_header Link '</api/schema/swagger-ui/>; rel="service-doc"' always;
        add_header Link '</.well-known/mcp/server-card.json>; rel="describedby"' always;

        # Markdown for Agents: proxy Accept: text/markdown requests to Django
        # Note: add_header above does NOT apply to proxied responses; Django sets its own Link headers.
        if ($http_accept ~* "text/markdown") {
            proxy_pass $qjudge_backend;
        }
        try_files $uri $uri/ /index.html;
    }
}
