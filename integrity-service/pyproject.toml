[project]
name = "qjudge-integrity-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6,<3.0",
]

[project.optional-dependencies]
worker = [
  "fastapi>=0.109,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "httpx>=0.26,<1.0",
  "jsonschema>=4.21,<5.0",
  "cryptography>=42,<46",
]
controller = [
  "fastapi>=0.109,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "httpx>=0.26,<1.0",
  "docker>=7,<8",
]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
