[project]
name = "qjudge-integrity-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.26.0,<5.0",
  "pydantic>=2.14.3,<3.0",
  "referencing>=0.37.0,<1.0",
]

[project.optional-dependencies]
worker = [
  "fastapi>=0.162.2,<1.0",
  "uvicorn[standard]>=0.54.0,<1.0",
  "httpx>=0.28.1,<1.0",
  "cryptography>=50.0.2,<51",
]
test = [
  "pytest>=9.2.0,<10",
  "pytest-asyncio>=1.4.1.post1,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
