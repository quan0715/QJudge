x-django-environment: &django_prod_environment
  DJANGO_ENV: production
  DEBUG: "False"
  DJANGO_SETTINGS_MODULE: config.settings.prod
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  DB_NAME: ${DB_NAME:?DB_NAME is required}
  DB_USER: ${DB_USER:?DB_USER is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_HOST: pgbouncer
  DB_PORT: "5432"
  DB_SSLMODE: ${DB_SSLMODE:-disable}
  REDIS_URL: redis://redis:6379/0
  OAUTH_ISSUER_URL: ${OAUTH_ISSUER_URL:?OAUTH_ISSUER_URL is required}
  FRONTEND_URL: ${FRONTEND_URL:-https://q-judge.com}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS is required}
  MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-https://mcp.q-judge.com}
  AUTH_EMAIL_PASSWORD_ENABLED: ${AUTH_EMAIL_PASSWORD_ENABLED:-True}
  QAUTH_PROVIDER_CONNECTIONS_JSON: ${QAUTH_PROVIDER_CONNECTIONS_JSON:-[]}
  NYCU_OAUTH_CLIENT_ID: ${NYCU_OAUTH_CLIENT_ID:-}
  NYCU_OAUTH_CLIENT_SECRET: ${NYCU_OAUTH_CLIENT_SECRET:-}
  GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
  GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  RECUR_PUBLISHABLE_KEY: ${RECUR_PUBLISHABLE_KEY:-}
  RECUR_SECRET_KEY: ${RECUR_SECRET_KEY:-}
  RECUR_WEBHOOK_SECRET: ${RECUR_WEBHOOK_SECRET:-}
  RECUR_PRODUCT_PRO_ID: ${RECUR_PRODUCT_PRO_ID:-}
  RECUR_PRODUCT_TEAM_ID: ${RECUR_PRODUCT_TEAM_ID:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@example.com}
  EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}

x-ai-runtime-environment: &ai_prod_environment
  AI_DATABASE_URL: ${AI_DATABASE_URL:?AI_DATABASE_URL is required}
  AI_REDIS_URL: ${AI_REDIS_URL:-redis://redis:6379/2}
  AI_QUEUE_NAME: qjudge-ai
  AI_QUEUE_KEY_PREFIX: "qjudge-ai:"
  CREDENTIAL_LEASE_SECRET: ${CREDENTIAL_LEASE_SECRET:?CREDENTIAL_LEASE_SECRET is required}
  MCP_SERVER_ID: qjudge
  MCP_TOKEN_EXCHANGE_URL: http://backend:8000/api/oauth/token-exchange/
  QJUDGE_MCP_URL: http://qjudge-mcp:9000/mcp
  AI_OAUTH_ISSUER: ${OAUTH_ISSUER_URL:?OAUTH_ISSUER_URL is required}
  AI_OAUTH_JWKS_URL: http://backend:8000/.well-known/jwks.json
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  AI_ARTIFACT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:?OBJECT_STORAGE_ENDPOINT_URL is required}
  AI_ARTIFACT_STORAGE_PUBLIC_ENDPOINT_URL: ${OBJECT_STORAGE_PUBLIC_ENDPOINT_URL:?OBJECT_STORAGE_PUBLIC_ENDPOINT_URL is required}
  AI_ARTIFACT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
  AI_ARTIFACT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
  AI_ARTIFACT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
  AI_ARTIFACT_STORAGE_AUTO_CREATE_BUCKET: ${OBJECT_STORAGE_AUTO_CREATE_BUCKETS:-false}
  AI_ARTIFACT_S3_BUCKET: ${AI_ARTIFACT_S3_BUCKET:-ai-artifacts}
  AI_ARTIFACT_MAX_BYTES: ${AI_ARTIFACT_MAX_BYTES:-10485760}

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: oj_postgres
    restart: always
    # Raise max_connections so pgBouncer's server pool never hits the hard cap.
    # With pool_size=30 pgBouncer never needs more than ~50 server connections;
    # 200 gives headroom for migrations, admin tools, and monitoring.
    command: postgres -c max_connections=200 -c shared_buffers=256MB -c work_mem=4MB
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - oj_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required} -d postgres",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Idempotent for both fresh clusters and volumes created before DB isolation.
  ai-db-bootstrap:
    image: postgres:15-alpine
    restart: "no"
    command: ["/bin/sh", "/bootstrap/bootstrap-ai-database.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      AI_DB_NAME: ${AI_DB_NAME:-qjudge_ai}
      AI_DB_USER: ${AI_DB_USER:?AI_DB_USER is required}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?AI_DB_PASSWORD is required}
    volumes:
      - ./scripts/db/bootstrap-ai-database.sh:/bootstrap/bootstrap-ai-database.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oj_network

  # PgBouncer – connection pooler in front of Postgres.
  # Session mode: fully compatible with SELECT FOR UPDATE and transaction.atomic.
  # With CONN_MAX_AGE=0 in Django, each request borrows a server connection from
  # this pool and returns it immediately after the response, so Postgres never
  # accumulates idle connections from idle Django threads.
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    container_name: oj_pgbouncer
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-online_judge}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # Use plaintext auth inside Docker network so PgBouncer can authenticate
      # against Postgres even when server-side password hashing is SCRAM.
      AUTH_TYPE: plain
      POOL_MODE: session
      # Accept up to 500 simultaneous client connections (Django threads + Celery).
      MAX_CLIENT_CONN: "500"
      # Keep at most 50 real server connections to Postgres per database/user pair.
      DEFAULT_POOL_SIZE: "50"
      RESERVE_POOL_SIZE: "20"
      RESERVE_POOL_TIMEOUT: "3"
      MAX_DB_CONNECTIONS: "150"
      QUERY_WAIT_TIMEOUT: "120"
      # Release idle server connections after 10 minutes.
      SERVER_IDLE_TIMEOUT: "600"
      # Never forcibly disconnect idle clients (Django manages its own lifecycle).
      CLIENT_IDLE_TIMEOUT: "0"
      SERVER_RESET_QUERY: "DISCARD ALL"
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
      LOG_STATS: "0"
    ports:
      - "6432:5432"
    depends_on:
      ai-db-bootstrap:
        condition: service_completed_successfully
    networks:
      - oj_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -p 5432 -U ${DB_USER:-postgres}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: oj_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - oj_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One migration owner gates every independently scaled AI runtime.
  ai-migrate:
    build: &ai_prod_build
      context: ./ai-service
      dockerfile: Dockerfile
    image: oj-ai-service:prod
    restart: "no"
    healthcheck:
      disable: true
    command: ["sh", "-c", "python -m alembic upgrade head && python -m infrastructure.checkpoints.langgraph_store setup"]
    environment:
      AI_DATABASE_URL: ${AI_DATABASE_URL:?AI_DATABASE_URL is required}
    volumes:
      - ./ai-service:/app
    depends_on:
      ai-db-bootstrap:
        condition: service_completed_successfully
    networks:
      - oj_network

  # AI Service (LangChain DeepAgent)
  ai-service:
    build: *ai_prod_build
    image: oj-ai-service:prod
    container_name: oj_ai_service
    restart: always
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    environment: *ai_prod_environment
    volumes:
      - ./ai-service:/app
    networks:
      - oj_network
    depends_on:
      ai-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "8", "http://localhost:8001/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  ai-worker:
    build: *ai_prod_build
    image: oj-ai-service:prod
    restart: always
    healthcheck:
      disable: true
    command: ["celery", "-A", "worker.celery_app:celery_app", "worker", "--queues=qjudge-ai", "--loglevel=INFO"]
    environment: *ai_prod_environment
    volumes:
      - ./ai-service:/app
    depends_on:
      ai-migrate:
        condition: service_completed_successfully
    networks:
      - oj_network

  ai-scheduler:
    build: *ai_prod_build
    image: oj-ai-service:prod
    restart: always
    healthcheck:
      disable: true
    command: ["celery", "-A", "worker.celery_app:celery_app", "beat", "--loglevel=INFO"]
    environment: *ai_prod_environment
    volumes:
      - ./ai-service:/app
    depends_on:
      ai-migrate:
        condition: service_completed_successfully
    networks:
      - oj_network

  # Django Backend (shared image with all Celery services — single build per compose up --build)
  backend:
    build: &backend_prod_build
      context: ./backend
      dockerfile: Dockerfile
      args:
        DJANGO_ENV: production
    image: oj-backend:prod
    container_name: oj_backend
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - judge_tmp:/judge_tmp
      - ./secrets/ai-oauth-ed25519-private.pem:/run-secrets/ai-oauth-ed25519-private.pem:ro
      - ./secrets/integrity/controller-token:/run-secrets/controller-token:ro
      - ./secrets/integrity/integrity-worker-signing-key:/run-secrets/integrity-worker-signing-key:ro
    ports:
      - "8000:8000"
    environment:
      <<: *django_prod_environment
      AI_SERVICE_URL: http://ai-service:8001
      AI_OAUTH_SIGNING_PRIVATE_KEY_FILE: /run-secrets/ai-oauth-ed25519-private.pem
      JUDGE_TMP_DIR: /judge_tmp
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:?OBJECT_STORAGE_ENDPOINT_URL is required}
      OBJECT_STORAGE_PUBLIC_ENDPOINT_URL: ${OBJECT_STORAGE_PUBLIC_ENDPOINT_URL:?OBJECT_STORAGE_PUBLIC_ENDPOINT_URL is required}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
      OBJECT_STORAGE_PRESIGNED_URL_TTL_SECONDS: ${OBJECT_STORAGE_PRESIGNED_URL_TTL_SECONDS:-300}
      ANTICHEAT_RAW_BUCKET: ${ANTICHEAT_RAW_BUCKET:-anticheat-raw}
      MARKDOWN_IMAGE_S3_BUCKET: ${MARKDOWN_IMAGE_S3_BUCKET:-markdown-images}
      MARKDOWN_IMAGE_MAX_BYTES: ${MARKDOWN_IMAGE_MAX_BYTES:-5242880}
      MARKDOWN_IMAGE_PUBLIC_BASE_URL: ${MARKDOWN_IMAGE_PUBLIC_BASE_URL:-}
      INTEGRITY_CONTROLLER_URL: http://integrity-controller:8010
      INTEGRITY_CONTROLLER_TOKEN_FILE: /run-secrets/controller-token
      INTEGRITY_WORKER_IMAGE: ${INTEGRITY_WORKER_IMAGE:-oj-integrity-worker:local}
      INTEGRITY_WORKER_SIGNING_PRIVATE_KEY_FILE: /run-secrets/integrity-worker-signing-key
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - oj_network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # The Controller is the only non-judge service that can create per-exam
  # Integrity Worker containers. It runs unprivileged and talks to Docker via
  # the socket group supplied by the deployment host.
  integrity-controller:
    build:
      context: ./integrity-service
      dockerfile: Dockerfile.controller
    image: oj-integrity-controller:prod
    container_name: oj_integrity_controller
    restart: unless-stopped
    environment:
      - INTEGRITY_CONTROLLER_INTERNAL_TOKEN_FILE=/run-secrets/controller-token
      - INTEGRITY_WORKER_IMAGE_ALLOWLIST=${INTEGRITY_WORKER_IMAGE:-oj-integrity-worker:local}
      - INTEGRITY_WORKER_NETWORK=${INTEGRITY_WORKER_NETWORK:-online_judge_oj_network}
      - BACKEND_INTERNAL_URL=http://backend:8000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./secrets/integrity/controller-token:/run-secrets/controller-token:ro
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID to the host Docker socket group}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    privileged: false
    networks:
      - oj_network
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://localhost:8010/health').status == 200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Profile-gated helper that makes the Worker image available locally without
  # starting a Worker. The Controller creates run-scoped Workers on demand.
  integrity-worker-image:
    image: ${INTEGRITY_WORKER_IMAGE:-oj-integrity-worker:local}
    build:
      context: ./integrity-service
      dockerfile: Dockerfile.worker
    command: ["python", "-c", "print('integrity worker image ready')"]
    restart: "no"
    profiles: ["build"]
    networks:
      - oj_network

  # Celery Worker - High Priority (Contest submissions)
  celery-high:
    build: *backend_prod_build
    image: oj-backend:prod
    container_name: oj_celery_high
    restart: always
    command: celery -A config worker -l info -Q high_priority --concurrency=2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - judge_tmp:/judge_tmp
    environment:
      <<: *django_prod_environment
      JUDGE_TMP_DIR: /judge_tmp
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:?OBJECT_STORAGE_ENDPOINT_URL is required}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
      ANTICHEAT_RAW_BUCKET: ${ANTICHEAT_RAW_BUCKET:-anticheat-raw}
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge-image:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - oj_network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # Celery Worker - Default (Practice submissions)
  celery:
    build: *backend_prod_build
    image: oj-backend:prod
    container_name: oj_celery
    restart: always
    command: celery -A config worker -l info -Q default --concurrency=2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - judge_tmp:/judge_tmp
    environment:
      <<: *django_prod_environment
      JUDGE_TMP_DIR: /judge_tmp
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:?OBJECT_STORAGE_ENDPOINT_URL is required}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
      ANTICHEAT_RAW_BUCKET: ${ANTICHEAT_RAW_BUCKET:-anticheat-raw}
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge-image:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - oj_network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # Celery Beat (Scheduler for periodic tasks)
  celery-beat:
    build: *backend_prod_build
    image: oj-backend:prod
    container_name: oj_celery_beat
    restart: always
    command: celery -A config beat -l info
    environment:
      <<: *django_prod_environment
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - oj_network

  # MCP Server (OAuth 2.1 + tool proxy)
  qjudge-mcp:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    container_name: oj_mcp
    environment:
      - DJANGO_BASE_URL=http://backend:8000
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL:-https://mcp.q-judge.com}
      - OAUTH_ISSUER_URL=${FRONTEND_URL:-https://q-judge.com}
    depends_on:
      - backend
    networks:
      - oj_network
    restart: unless-stopped

  # Frontend (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        RECUR_PUBLISHABLE_KEY: ${RECUR_PUBLISHABLE_KEY:-}
    container_name: oj_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - oj_network

  # Cloudflared Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: oj_cloudflared
    restart: always
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
    networks:
      - oj_network

  # GlitchTip Error Tracking
  glitchtip:
    image: glitchtip/glitchtip:latest
    container_name: oj_glitchtip
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me-in-production}
      REDIS_URL: redis://redis:6379/1
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-noreply@qjudge.local}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8080}
      ENABLE_ORGANIZATION_CREATION: "true"
    ports:
      - "8080:8000"
    networks:
      - oj_network

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    container_name: oj_glitchtip_worker
    restart: always
    command: ./bin/run-celery-with-beat.sh
    depends_on:
      - glitchtip
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me-in-production}
      REDIS_URL: redis://redis:6379/1
    networks:
      - oj_network

  # Judge Environment Image
  # Image is pre-pulled from GHCR by deploy-prod.sh (oj-judge:latest).
  # This service just ensures the image is present before celery workers start.
  judge-image:
    image: oj-judge:latest
    container_name: oj_judge_image
    command: ["true"]
    restart: "no"
    networks:
      - oj_network

volumes:
  postgres_data:
  static_volume:
  media_volume:
  judge_tmp:

networks:
  oj_network:
    driver: bridge
    name: ${INTEGRITY_WORKER_NETWORK:-online_judge_oj_network}
