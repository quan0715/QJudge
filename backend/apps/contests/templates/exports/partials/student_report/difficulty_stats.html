<section class="difficulty-section"><h2>{{ title }}</h2><div class="difficulty-row">
{% for item in items %}<div class="difficulty-item"><h3>{{ item.label }}</h3><div class="difficulty-track"><div style="width: {{ item.percentage }}%"></div></div>{% for detail in item.details %}<p>{{ detail.label }} <strong>{{ detail.value }}</strong></p>{% endfor %}</div>{% endfor %}
</div></section>
