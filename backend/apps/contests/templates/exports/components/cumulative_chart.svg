<svg width="{{ width }}" height="{{ height }}" viewBox="0 0 {{ width }} {{ height }}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="{{ score_label }}: {{ final_score }}" data-final-score="{{ final_score }}" data-solved="{{ solved }}" style="font-family: sans-serif;">
<rect width="{{ width }}" height="{{ height }}" fill="white"/>
{% for line in grid %}<line x1="{{ left }}" y1="{{ line.y }}" x2="{{ right }}" y2="{{ line.y }}" stroke="#e4e6ea"/><text x="{{ line.label_x }}" y="{{ line.y }}" text-anchor="end" font-size="{{ font_size }}" fill="#555c66">{{ line.value }}</text>{% endfor %}
{% for tick in ticks %}<text x="{{ tick.x }}" y="{{ tick.y }}" text-anchor="middle" font-size="{{ font_size }}" fill="#555c66">{{ tick.value }}</text>{% endfor %}
<path id="score_line" d="{{ path }}" fill="none" stroke="#1d2127" stroke-width="2"/>
<text x="{{ axis_x }}" y="{{ axis_y }}" text-anchor="middle" font-size="{{ font_size }}" fill="#555c66">{{ time_label }}</text>
</svg>
